<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livyato</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#020504;--ink:#f4faf6;--soft:#c3d0c8;--em:#34e89e;--em2:#7dffc4;--line:rgba(125,255,196,.3);--glass:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.65 "Instrument Sans",system-ui,sans-serif;background:radial-gradient(800px 520px at 90% -10%,rgba(52,232,158,.16),transparent 62%),radial-gradient(640px 460px at -8% 105%,rgba(20,150,110,.12),transparent 62%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4,.brand{font-family:"Space Grotesk","Instrument Sans",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
a{color:var(--em2)}
a:focus-visible,summary:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:600;text-decoration:none;color:#021208;background:linear-gradient(135deg,#9dffd0,#2fd68a);box-shadow:0 0 24px rgba(52,232,158,.35);min-height:44px}
.btn.g{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);box-shadow:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:20px;padding:14px 5vw;background:rgba(2,5,4,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .brand{font-size:1.1rem;letter-spacing:.3em;color:#fff;text-decoration:none;margin-right:auto}
nav a.l{color:var(--soft);text-decoration:none;font-size:.95rem}
nav a.l:hover{color:#fff}
@media(max-width:700px){nav a.l{display:none}}
main{max-width:840px;margin:0 auto;padding:64px 6vw 80px}
main h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;margin-bottom:10px}
.up{color:var(--soft);font-size:.9rem;margin:0 0 28px}
main h2{font-size:1.3rem;margin:34px 0 8px;color:#fff}
main p,main li{color:var(--soft)}
main li{margin:6px 0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:16px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.card h3{font-size:1.1rem;margin-bottom:6px}.card p{margin:0}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}.step b{font:700 .95rem "Space Grotesk",sans-serif;color:var(--em2);letter-spacing:.15em}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:10px 0}.kv b{color:#fff;font-weight:600}.kv span{color:var(--soft)}
@media(max-width:520px){.kv{grid-template-columns:1fr}}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;color:var(--soft)}
th{color:#fff;background:rgba(52,232,158,.1);font-weight:600}
td b{color:#fff}
details{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px 0}
summary{cursor:pointer;font-weight:600;color:#fff;min-height:28px}
details p{margin:10px 0 0}
.empty{text-align:center;padding:34px 20px}
.empty h2{margin-top:0}
footer{border-top:1px solid var(--line);padding:46px 5vw 28px;background:rgba(2,5,4,.6)}
.fgrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:30px}
@media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}}
footer .brand{font-size:1.1rem;letter-spacing:.3em;color:#fff;text-decoration:none}
footer p{color:var(--soft);font-size:.92rem;margin:10px 0 0}
footer h4{font-size:.8rem;letter-spacing:.25em;color:var(--em2);margin-bottom:12px;text-transform:uppercase}
footer ul{list-style:none;margin:0;padding:0}
footer li a{display:inline-block;padding:6px 0;color:var(--soft);text-decoration:none;min-height:32px}
footer li a:hover{color:#fff}
.soc{display:flex;flex-wrap:wrap;gap:10px}
.si{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
.si svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si svg .f{fill:currentColor;stroke:none}
span.si{opacity:.6;cursor:default}
a.si:hover{border-color:var(--em2);color:var(--em2)}
.fine{max-width:1180px;margin:28px auto 0;text-align:center;font-size:.85rem}
/* ---- Livyato shared UI: consent banner + interactive buttons ---- */
button,.btn,a.si,nav a.l,.fgrid li a,summary,#nav li{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,filter .22s ease,background-color .2s ease,border-color .2s ease,color .2s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.liv-hov:not(:disabled),.btn.liv-hov,a.si.liv-hov{transform:translate(var(--lx,0px),var(--ly,0px)) translateY(-2px) scale(1.05);box-shadow:0 10px 30px rgba(52,232,158,.38),0 0 0 1px rgba(125,255,196,.5)}
nav a.l.liv-hov,.fgrid li a.liv-hov{transform:translate(var(--lx,0px),var(--ly,0px)) translateX(3px)}
summary.liv-hov,#nav li.liv-hov{transform:translateX(4px)}
button.liv-press:not(:disabled),.btn.liv-press,a.si.liv-press{transform:scale(.94)!important;transition-duration:.08s!important;box-shadow:0 0 0 3px rgba(125,255,196,.5)!important}
.liv-pop{animation:liv-pop .38s cubic-bezier(.2,.9,.3,1.4)}
@keyframes liv-pop{0%{transform:scale(.94)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.liv-rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.38);transform:scale(0);animation:liv-rip .65s ease-out forwards}
@keyframes liv-rip{to{transform:scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){button.liv-hov,.btn.liv-hov,a.si.liv-hov,nav a.l.liv-hov,.fgrid li a.liv-hov,summary.liv-hov{transform:none!important}.liv-pop,.liv-rip{animation:none!important}button.liv-press,.btn.liv-press,a.si.liv-press{transform:none!important}}
#liv-cc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:99999;width:min(940px,calc(100% - 24px));display:flex;gap:16px 22px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-radius:18px;background:linear-gradient(145deg,rgba(18,30,24,.96),rgba(6,12,9,.96));border:1px solid rgba(125,255,196,.4);box-shadow:0 18px 50px rgba(0,0,0,.6);color:#f4faf6;font:15px/1.5 "Instrument Sans",system-ui,sans-serif;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#liv-cc p{margin:0;flex:1 1 360px;color:#d6e3db}
#liv-cc a{color:#7dffc4}
#liv-cc .cc-b{display:flex;gap:10px;flex-wrap:wrap}
#liv-cc button{font:600 .95rem "Instrument Sans",system-ui,sans-serif;min-height:44px;padding:10px 20px;border-radius:999px;cursor:pointer;color:#021208;background:linear-gradient(135deg,#9dffd0,#2fd68a);border:1px solid rgba(255,255,255,.45)}
#liv-cc button.g{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(125,255,196,.6)}

</style>
</head>
<body>
<nav aria-label="Main"><a class="brand" id="home1" href="#">LIVYATO</a><a class="l" id="home2" href="#">Home</a><a class="l" href="#how-it-works">How it works</a><a class="l" href="#pricing">Pricing</a><a class="l" href="#troubleshooting">Help</a><a class="btn" id="app1" href="#">Open Livyato</a></nav>
<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>
<script>
var HOME="/",APP="/app";
/* Business details. Fill in the empty ones when you have them; empty values are not shown. */
var BIZ={owner:"Senzo Makhanya",trade:"Livyato",country:"South Africa",email:"support.livyato@gmail.com",phone:"",address:"",reg:"",vat:""};
var SOCIAL={instagram:"",x:"",facebook:"",tiktok:"",youtube:"",linkedin:"",whatsapp:""};
var UPD="8 November 2026",VER="2.0";
function mail(){return '<a href="mailto:'+BIZ.email+'">'+BIZ.email+'</a>'}
function H(t){return '<h2>'+t+'</h2>'}function P(t){return '<p>'+t+'</p>'}function U(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'}
function T(h,rows){return '<div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join("")+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td>'+(i===0?'<b>'+c+'</b>':c)+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function biz(){var r=[["Trading name",BIZ.trade],["Operated by",BIZ.owner],["Country",BIZ.country],["Email",mail()]];if(BIZ.phone)r.push(["Telephone",BIZ.phone]);if(BIZ.address)r.push(["Physical address",BIZ.address]);if(BIZ.reg)r.push(["Registration number",BIZ.reg]);if(BIZ.vat)r.push(["VAT number",BIZ.vat]);r.push(["Information Officer",BIZ.owner+" ("+BIZ.email+")"]);
 return '<div class="card"><div class="kv">'+r.map(function(x){return '<b>'+x[0]+'</b><span>'+x[1]+'</span>'}).join("")+'</div></div>'}
function head(t,s){return '<h1>'+t+'</h1><p class="up">Version '+VER+'. Last updated '+UPD+'.'+(s?' '+s:'')+'</p>'}
var PAGES={
"how-it-works":{t:"How it works",h:function(){return '<h1>How Livyato works</h1><p class="up">From bank statement to organised books in five short steps.</p>'
+[["01","Upload","Drop in a CSV, Excel or text-based PDF statement from your bank. Livyato works out the bank, the period and which column is which. If it cannot tell, it asks you to pick the columns."],
["02","Organise","Every transaction is sorted into a category such as fuel, advertising or software, with a visible confidence level. Livyato also flags possible duplicates."],
["03","Review","Check the items it was unsure about. Approve, change or flag them for your accountant. Your corrections are remembered next time."],
["04","See your finances","Money received, money spent, estimated expenses, estimated operating profit and monthly cash flow, explained in plain English."],
["05","Download","Take away an Excel workbook, an accountant report, a monthly bookkeeping report or a CSV."]].map(function(s){return '<div class="card step"><b>'+s[0]+'</b><div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div></div>'}).join("")
+H("Where your data goes")+P("Your statement is read in your browser. It is uploaded to Livyato's servers only if you sign in and choose to save it. The built-in assistant answers your questions using fixed rules and calculations on your own data. It does not send your questions to an AI company. Read the <a href=\"#privacy\">Privacy Policy</a> for the full picture.")
+H("What Livyato does not do")+U(["It does not file anything with SARS.","It does not give tax or accounting advice. Tax figures are preparation and estimates for you or your accountant to check.","It cannot read scanned or photographed PDF statements."])+'<p><a class="btn" href="'+APP+'" target="_top">Open Livyato</a></p>'}},
"pricing":{t:"Pricing",h:function(){return '<h1>Pricing</h1><p class="up">Livyato is still being built.</p><div class="card empty"><h2>Livyato is free to use right now</h2><p>No payment is taken today, and there are no paid plans to choose from.</p></div>'
+H("No hidden fees")+P("If we introduce paid features, we will:")+U(["show the full price, including VAT and any other charge, before you commit;","never charge you without your clear agreement;","not add set-up, cancellation or \u201cadministration\u201d fees that were not shown upfront;","publish the price and the <a href=\"#refund\">refund terms</a> on this page before the first payment is taken."])+'<p style="margin-top:18px"><a class="btn" href="'+APP+'" target="_top">Try the current version</a></p>'}},
"reviews":{t:"Reviews",h:function(){return '<h1>Reviews</h1><p class="up">What people say about Livyato.</p><div class="card empty"><h2>No reviews yet</h2><p>Livyato is new, and we only publish feedback we have genuinely received. If you try it, we would like to hear what worked and what did not.</p><p style="margin-top:18px"><a class="btn g" href="#contact">Share feedback</a></p></div>'}},
"troubleshooting":{t:"Troubleshooting",h:function(){return '<h1>Troubleshooting</h1><p class="up">Quick fixes for the most common problems.</p>'
+[["My file would not open or nothing was found","Export the statement from internet banking as CSV or Excel and try again. Make sure the file has a heading row with names like Date, Description and Amount. If Livyato cannot tell the columns apart, it shows a picker so you can choose them yourself."],
["My PDF statement failed","Livyato can read PDFs that contain real text. A scanned or photographed PDF cannot be read. Download the CSV or Excel version from your bank instead."],
["Everything is marked as money in, or everything as money out","Your bank may use a separate Dr/Cr column, or separate debit and credit columns. Use the column picker, or export a different format."],
["Too many items are uncategorised","Change a category once in the Review step and Livyato remembers it for similar payments. Items it is unsure about are listed so you can sort them quickly."],
["A download did not save","Each file asks for your confirmation before it saves. Accept the prompt, and check that your browser has not blocked the download."],
["AI sorting or receipt reading is not working","These features need your permission and an internet connection. Allow the prompt when it appears, then try again."],
["My saved work is gone","Saved work stays in your browser on that device. It disappears if you clear your browser data, use a private window, or switch devices."],
["The fonts look plain","Fonts from Google Fonts only load if you choose \u201cAccept optional\u201d in the privacy banner. Livyato works the same without them. You can change your choice any time under \u201cCookie settings\u201d in the footer."],
["The page looks cramped on my phone","Turn your phone sideways, or use the Excel workbook and reports on a larger screen. If a specific screen is broken, tell us which one."]
].map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>'}).join("")+'<p style="margin-top:24px">Still stuck? <a href="#contact">Contact us</a>.</p>'}},
"promo-codes":{t:"Promo codes",h:function(){return '<h1>Promo codes</h1><p class="up">Discounts and offers.</p><div class="card empty"><h2>No promo codes right now</h2><p>Livyato has no paid plans yet, so there is nothing to discount. Any future offers will be listed here.</p></div>'}},
"contact":{t:"Contact",h:function(){return '<h1>Contact</h1><p class="up">Questions, feedback, requests or problems.</p>'+biz()
+H("How to reach us")+P("Email "+mail()+". We aim to reply within 5 working days. Use these subject lines so your message reaches the right place:")+U(["<b>Support</b>: something is not working;","<b>Data deletion request</b>: see <a href=\"#deletion\">how to ask us to delete your data</a>;","<b>Privacy</b>: questions about how your information is handled;","<b>Security</b>: you think you found a vulnerability, see <a href=\"#security\">Security</a>;","<b>Feedback</b>: what worked and what did not."])
+P("Please do not email full bank statements, account numbers, ID numbers or passwords. If you need to show us a problem, remove or replace the sensitive details first.")}},
"terms":{t:"Terms of Service",h:function(){return head("Terms of Service")
+H("1. About these Terms")+P("These Terms of Service (\u201cTerms\u201d) govern your access to and use of Livyato, including the website, the bookkeeping tool, the AI features and the information pages (together, the \u201cService\u201d). The Service is operated by Senzo Makhanya, trading as Livyato (\u201cwe\u201d, \u201cus\u201d, \u201cour\u201d). By using the Service you agree to these Terms. If you do not agree, please do not use the Service.")
+H("2. Who we are")+biz()
+H("3. Who may use Livyato")+U(["You must be 18 years or older. Livyato is a business tool and is not intended for children. We do not knowingly process the personal information of anyone under 18. See the <a href=\"#privacy\">Privacy Policy</a>, section 15.","You must have legal capacity to agree to these Terms. If you use Livyato for a business or on someone else\u2019s behalf, you confirm that you are authorised to do so.","We may refuse or end access to anyone who breaks these Terms."])
+H("4. What Livyato does")+P("Livyato reads bank statements, receipts and similar documents that you choose to load, suggests categories for transactions, and produces summaries, estimates and exports. Statements are read in your browser. Livyato has no user accounts. Some features are optional and use an AI model (section 8). The Service is under development, and features may change.")
+H("5. Not professional advice")+U(["Livyato is a preparation tool. It is not an accountant, auditor, tax practitioner, financial adviser or lawyer, and using it does not create a professional relationship with us.","Categories, profit figures, VAT figures, provisional tax figures and forecasts are automatic estimates. They depend on the data you load and the choices you make, and they may be wrong or incomplete.","We do not file returns, VAT201s or anything else with SARS or any authority. You remain responsible for your own tax and legal obligations, records and deadlines.","Tax rules, rates and thresholds change. Check figures with a qualified professional before you rely on them or submit anything."])
+H("6. Your content and your data")+U(["You keep all rights in the files, receipts and information you load (\u201cyour content\u201d). We claim no ownership of it.","You give us permission to process your content only as needed to provide the features you use, for example reading a statement in your browser or, with your permission, sending selected details to the AI model.","You confirm that you have the right to use your content. Statements and receipts can contain other people\u2019s personal information, such as customers, suppliers or employees. You are responsible for handling that information lawfully.","Remove or replace account numbers, ID numbers and other sensitive details that you do not need before loading a file.","Saved work lives in your browser and can be lost if you clear your browser data or change device. Keep your own copies of anything important."])
+H("7. Acceptable use")+P("You agree not to:")+U(["use the Service for anything unlawful, including fraud, money laundering, tax evasion or preparing false records;","load content you have no right to use;","try to gain unauthorised access to the Service, other people\u2019s data or our hosting, or interfere with its operation, for example with malware or excessive automated requests;","copy, resell, reverse engineer or build a competing service from the Service, except where the law or an open-source licence allows it;","probe the Service for weaknesses outside the responsible-disclosure process on the <a href=\"#security\">Security page</a>;","use the Service or its output to mislead anyone, for example by presenting estimates as audited figures."])
+H("8. The assistant")+U(["Livyato's assistant answers questions about your numbers using fixed rules and calculations on your own data. It does not use an external AI model.","It can still be wrong or incomplete if your data is incomplete. Check it against your own records. Do not rely on it for decisions with legal or financial consequences without professional advice."])
+H("9. Third-party services, libraries and links")+P("Livyato relies on third-party services and software, listed in the <a href=\"#privacy\">Privacy Policy</a> and on the <a href=\"#licences\">Licences and credits</a> page. We are not responsible for third-party services, and your use of them may be subject to their own terms. Links to other sites are provided for convenience, and we do not control or endorse their content.")
+H("10. Fees and payments")+U(["Livyato is currently free to use. We do not take payment.","There are no hidden fees. If we introduce paid features we will show the full price, including VAT and any other charge, before you commit. We will not charge you without your clear agreement and will not add charges that were not shown upfront.","We will publish prices and payment terms on the <a href=\"#pricing\">Pricing page</a> before the first payment is taken. A price change will not apply to a period you have already paid for."])
+H("11. Refunds and cancellation")+P("See the <a href=\"#refund\">Refund Policy</a>. Nothing in these Terms limits any refund or cancellation right you have by law.")
+H("12. Intellectual property")+U(["We own the Livyato software, design, brand, name, logo and original text, apart from third-party materials listed on the <a href=\"#licences\">Licences and credits</a> page.","We give you a limited, personal, non-exclusive, non-transferable, revocable licence to use the Service for your own or your business\u2019s internal purposes, in line with these Terms.","\u201cLivyato\u201d and our logo may not be used without our written permission. Other brand names and logos belong to their owners.","If you send us feedback, you allow us to use it to improve the Service without payment or obligation to you."])
+H("13. Availability and changes")+P("We aim to keep the Service available but do not promise it will be uninterrupted or error-free. We may change, suspend or remove features, or the whole Service, at any time. Where practical we will give notice of significant changes.")
+H("14. Disclaimer")+P("To the extent the law allows, the Service is provided \u201cas is\u201d and \u201cas available\u201d. We make no promise about the accuracy of categories, calculations, estimates, forecasts or AI answers, about compatibility with every bank\u2019s file format, or about fitness for a particular purpose. Nothing in this section removes a right you have under the Consumer Protection Act 68 of 2008 or other law that cannot be excluded.")
+H("15. Limitation of liability")+U(["To the extent the law allows, we are not liable for indirect or consequential loss, loss of profit or revenue, loss of data, penalties, interest or assessments imposed by SARS or any other authority, or loss arising from missed deadlines, errors in estimates or reliance on AI output.","To the extent the law allows, our total liability to you for any claim relating to the Service is limited to the amount you paid us for the Service in the 12 months before the claim. While the Service is free, that amount is nil.","Nothing in these Terms limits or excludes liability for our gross negligence or intentional misconduct, or any liability that cannot lawfully be limited or excluded, including under the Consumer Protection Act."])
+H("16. Indemnity")+P("You will cover reasonable losses and legal costs that we suffer because of a claim by a third party that arises from your unlawful use of the Service, your breach of these Terms, or content you load without the right to do so. This does not apply to the extent that the loss was caused by us.")
+H("17. Privacy, cookies and security")+P("Our <a href=\"#privacy\">Privacy Policy</a>, <a href=\"#cookies\">Cookie Policy</a> and <a href=\"#security\">Security page</a> form part of these Terms.")
+H("18. Suspension and termination")+P("You may stop using the Service at any time. We may suspend or end your access if you break these Terms, if we must do so by law, or if continuing would put the Service or other people at risk. Sections that by their nature should continue after termination, such as intellectual property, disclaimers, liability and disputes, will continue.")
+H("19. Events beyond our control")+P("We are not responsible for failure or delay caused by events beyond our reasonable control, including power outages and load-shedding, internet, hosting or third-party service failures, cyber-attacks despite reasonable precautions, government action or natural disasters.")
+H("20. Communication and email")+U(["We communicate by email at the address you write to us from. Emails you send us may be kept as set out in the Privacy Policy.","We do not send marketing email without your opt-in. Every marketing email we ever send will contain a working unsubscribe link, and we will stop when you unsubscribe or ask us to."])
+H("21. Disputes")+P("If you have a complaint, email us first at "+mail()+" and give us 30 days to try to resolve it. If we cannot, you may use any complaint or dispute process available to you by law, including the National Consumer Commission, the consumer tribunals and courts, or the Information Regulator for privacy matters. South African courts have jurisdiction.")
+H("22. Governing law")+P("These Terms are governed by the laws of the Republic of South Africa.")
+H("23. Changes to these Terms")+P("We may update these Terms. The version and date at the top show the latest update. For material changes we will give notice on our homepage, where practical at least 30 days before they take effect. By continuing to use the Service after the effective date you accept the updated Terms. If you do not accept them, stop using the Service.")
+H("24. General")+U(["These Terms, together with the policies they refer to, are the whole agreement between you and us about the Service.","If part of these Terms is found to be invalid or unenforceable, the rest continues to apply.","If we do not enforce a right straight away, we have not given it up.","You may not transfer your rights under these Terms without our written consent. We may transfer ours to a successor of the business.","These Terms are in English. Agreeing to them electronically is valid under the Electronic Communications and Transactions Act 25 of 2002."])
+H("25. Contact")+P("Questions about these Terms: "+mail()+".")}},
"privacy":{t:"Privacy Policy",h:function(){return head("Privacy Policy")
+P("We respect your privacy and handle personal information in line with South Africa\u2019s Protection of Personal Information Act 4 of 2013 (POPIA). This policy explains what we process, why, where it goes, how long we keep it, and what you can do about it.")
+H("1. Who is responsible")+biz()+P("The Information Officer is the person to contact about privacy.")
+H("2. What this policy covers")+P("It covers the Livyato website, the bookkeeping tool, the AI features, our information pages and email you send us.")
+H("3. What information is involved")+T(["Category","Examples","Where it lives"],[["Files you load","Bank statements, receipts and invoices. These can contain names, account details, transaction descriptions and amounts, including other people\u2019s information.","In your browser, unless you choose to save it to your account."],["Details you type","Business name, type, industry, email, phone, address, registration or VAT number, customer and invoice details. All optional unless a feature needs them.","In your browser\u2019s local storage."],["Your choices","Category corrections, column mappings, settings, your cookie choice and its date.","In your browser\u2019s local storage."],["Your account","Your email address and sign-in details if you register.","Our sign-in provider, section 10."],["Statements you save","Files and transactions you choose to save to your account.","Our database and file storage, section 10."],["Payment details","Subscription payments are handled by our payment provider. We do not store card numbers.","Our payment provider, section 10."],["Emails you send us","Your email address, name, message and any attachments.","Our email inbox."],["Technical data","IP address, browser and device details, requests to the pages.","Processed by our hosting platform and the third parties in section 10."]])

+H("9. Transfers outside South Africa")+U(["Our hosting, database, file storage and payment providers may process information in other countries.","We choose provider regions close to South Africa where they are offered, and we rely on written terms with each provider for any transfer abroad.","Do not send information you do not want shared, and avoid sending special personal information (section 17)."])
+H("10. Third parties and services")+P("We do not use advertising or analytics SDKs, social media pixels or session-recording tools. These are the third parties involved:")+T(["Service","Why","What it can see","Needed?"],[["Netlify","Hosts the website and runs our server code","Technical data when you visit and the requests you make","Yes"],["Supabase","Stores accounts, saved statements and uploaded files, and handles sign-in","Your account details and what you choose to save","Only if you create an account"],["Paystack","Processes subscription payments","Your email and payment details. We do not see card numbers","Only if you subscribe"],["Google Fonts (Google)","Typefaces","Your IP address and browser details","No. Loads only if you accept optional"],["cdnjs (Cloudflare)","Delivers code libraries so the page works: Three.js, GSAP, SheetJS, PDF.js","Your IP address and browser details","Yes, for the pages that use them"]])

+H("12. How long we keep information")+U(["Your files and work: on your device until you delete them. If you save them to your account, until you delete them or close your account.","Your cookie choice: until you change it or clear your browser data.","Emails you send us: only as long as needed to deal with your request and any follow-up, then deleted within 12 months, unless the law requires us to keep them longer or we need them for a legitimate legal claim.","Payment records: kept for as long as the law requires for tax and accounting."])
+H("13. Security")+P("We protect information with safeguards that suit the risk, described on the <a href=\"#security\">Security page</a>. These include keeping your files in your browser, escaping text before it is displayed, using HTTPS, and having a procedure for security incidents. Livyato has no server-side database, so database attacks such as SQL injection do not currently apply. If we add one, the commitments on the Security page apply.")
+H("14. If something goes wrong")+P("If we have reasonable grounds to believe that personal information has been accessed or acquired by an unauthorised person, we will notify the Information Regulator and the affected people as soon as reasonably possible, as section 22 of POPIA requires. The notice will tell you what happened and what you can do to protect yourself.")
+H("15. Children")+P("Livyato is for people aged 18 or over. We do not knowingly collect or process the personal information of children, who are people under 18. Do not load a child\u2019s personal information into Livyato unless you are their parent or legal guardian, or are otherwise legally authorised to do so. If you believe a child\u2019s information has been sent to us, email "+mail()+" and we will delete it.")
+H("16. Email and direct marketing")+P("We do not currently send marketing email, and we only email you to reply to you. We will only send marketing with your opt-in consent. Every marketing email will include a working unsubscribe link, and we will stop when you unsubscribe or ask us to.")
+H("17. Special personal information")+P("Bank statements can reveal sensitive details such as health, religion, union membership or other special personal information. We do not collect it on purpose and do not use it for any other purpose. Where it appears in your files, it stays in your browser, unless you choose to send it to an AI feature.")

+H("20. Your rights")+P("You may ask us to:")+U(["confirm whether we hold your personal information and give you access to it;","correct or delete personal information that is inaccurate, irrelevant, excessive, out of date, incomplete, misleading or unlawfully obtained;","stop processing your information, or object to it;","withdraw your consent at any time. This does not affect processing that already took place.","explain how this policy applies to your situation."])

"security":{t:"Security",h:function(){return head("Security")
+P("This page explains how we protect Livyato and your information, what we do about attacks such as SQL injection, and how to report a problem.")
+H("Our design keeps risk low")+U(["<b>Your files stay in your browser.</b> Statements are read on your device and are not uploaded to a Livyato server.","<b>No accounts and no passwords.</b> There are no user passwords to steal.","<b>No server-side database.</b> Livyato does not currently run a database, so no database queries are built from anything you enter."])
+H("SQL injection and similar attacks")+P("SQL injection happens when a site builds database commands from untrusted text. Because Livyato has no database today, that attack does not apply. We still follow a process to stop it and other attacks, and the following become mandatory before any server or database is added:")+U(["parameterised queries or prepared statements only, never joining user text into a query;","validation of all input on the server, by type, length and format, with allow-lists where possible;","least-privilege database accounts, so a flaw cannot read or change more than it needs to;","secrets and keys kept out of code and out of the browser;","encryption of personal information in transit and, where it is stored, at rest;","dependency and vulnerability checks, and a security test before launch;","logging of security events, regular backups and restricted access for administrators."])
+H("Protection in the browser today")+U(["Text that comes from your files is escaped before it is displayed, to block cross-site scripting.","Pages are served over HTTPS by the hosting platform.","Code libraries are loaded from a CDN at fixed versions.","No advertising, analytics or tracking scripts run on our pages.","The AI features only run after you give permission."])
+H("Keeping your own data safe")+U(["Remove account numbers, ID numbers and anything sensitive that you do not need before loading a file.","On a shared computer, clear your browser data when you finish.","Keep your browser and device up to date, and be wary of links in emails that claim to come from Livyato."])
+H("If there is a security incident")+U(["We contain the problem, find out what happened and fix the cause.","If personal information may have been accessed by someone unauthorised, we notify the Information Regulator and the affected people as soon as reasonably possible, as section 22 of POPIA requires, and tell you how to protect yourself.","We then review what went wrong and improve."])
+H("Report a vulnerability")+P("If you think you found a security problem, email "+mail()+" with the subject \u201cSecurity\u201d. Tell us where it is and how to reproduce it. We aim to acknowledge within 5 working days. Please give us reasonable time to fix it before sharing it, and do not access other people\u2019s data, disrupt the Service or demand payment. We will not take action against people who report in good faith and follow these rules.")}},

+H("2. Ask us to delete or correct information")+P("Email "+mail()+" with the subject \u201cData deletion request\u201d. Include:")+U(["your name and the email address you used to contact us;","what you want deleted, corrected or returned to you;","anything else that helps us find it, such as the date of your message."])

var KEY="liv_consent",FONT="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap",bar=null;

 bar.innerHTML='<p><b>Your privacy choices.</b> Livyato saves your work in your browser\u2019s local storage. That is strictly necessary and is never shared. With your permission we also load fonts from Google Fonts, which shares your IP address with Google. We do not use advertising or analytics cookies. <a href="'+pol+'" target="'+(pol.charAt(0)==="#"?"_self":"_top")+'">Read the cookie policy</a>.</p><div class="cc-b"><button type="button" data-c="1">Accept optional</button><button type="button" class="g" data-c="0">Essential only</button></div>';
 bar.addEventListener("click",function(e){var b=e.target.closest("button[data-c]");if(b)choose(b.getAttribute("data-c")==="1")});document.body.appendChild(bar)}

var rm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches),SEL="button,.btn,a.si,nav a.l,.fgrid li a,summary,#nav li",cur=null;

  var r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement("span");s.className="liv-rip";s.style.width=s.style.height=d+"px";s.style.left=(e.clientX-r.left-d/2)+"px";s.style.top=(e.clientY-r.top-d/2)+"px";el.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},700)}},{passive:true});
function release(e){var els=document.querySelectorAll(".liv-press");[].forEach.call(els,function(el){el.classList.remove("liv-press");if(!rm){el.classList.remove("liv-pop");void el.offsetWidth;el.classList.add("liv-pop");setTimeout(function(){el.classList.remove("liv-pop")},420)}})}
document.addEventListener("pointerup",release,{passive:true});document.addEventListener("pointercancel",release,{passive:true});
})();
